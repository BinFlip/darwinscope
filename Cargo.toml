[package]
name = "darwinscope"
version = "0.1.0"
edition = "2024"
authors = ["Johann Kempter <admin@binflip.rs>"]
rust-version = "1.88"
description = "Parse and inspect Mach-O binaries — including the Apple Objective-C and Swift runtime metadata they embed"
license = "Apache-2.0"
repository = "https://github.com/BinFlip/darwinscope"
readme = "README.md"
keywords = ["mach-o", "objective-c", "swift", "parser", "reverse-engineering"]
categories = ["parser-implementations"]
exclude = ["tests/samples/", "reference/", "research/"]

[features]
default = []
# Emit `tracing` events from sub-parsers when they bail out on truncated /
# corrupt input. Off by default — drops a `tracing` dep into your build.
tracing = ["dep:tracing"]

[dependencies]
goblin = "0.10.5"
bitflags = "2.11.1"
plist = "1.9.0"
blake3 = "1.8.5"
sha2 = "0.11.0"
tracing = { version = "0.1.44", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
proptest = "1.11.0"
