[package]
name = "darwinscope"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Parse and inspect Mach-O binaries — including the Apple Objective-C and Swift runtime metadata they embed"
license = "Apache-2.0"
repository = "https://github.com/ATRAPSLLC/darwinscope"
readme = "README.md"
keywords = ["mach-o", "objective-c", "swift", "parser", "reverse-engineering"]
categories = ["parser-implementations"]
exclude = ["tests/samples/", "reference/", "research/"]

# darwinscope is used in malware-analysis pipelines where every input
# byte is adversarial. These lints prevent the parser from panicking on
# malformed input. The `cfg_attr(test, allow(...))` escape hatch in
# `src/lib.rs` lets tests still use `unwrap`/`expect`/`panic` for terseness.
# This crate also denies `unsafe_code`.
[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
arithmetic_side_effects = "deny"
indexing_slicing = "deny"

[features]
default = []
# Emit `tracing` events from sub-parsers when they bail out on truncated /
# corrupt input. Off by default — drops a `tracing` dep into your build.
tracing = ["dep:tracing"]

[dependencies]
goblin = "0.10.7"
bitflags = "2.13.0"
plist = "1.9.0"
blake3 = "1.8.5"
sha2 = "0.11.0"
tracing = { version = "0.1.44", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
proptest = "1.11.0"
